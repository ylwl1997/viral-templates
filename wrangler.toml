# Cloudflare Pages. One shared D1 database for the apex and every brand host.
# Pages Functions read it as env.DB.
#
# Remote database already exists. Migration 0001_account.sql is applied.
# `wrangler pages deploy` binds this id as DB for production, and the same
# id for preview (preview_database_id).
#
# Local:
#   npm run pages:dev
# Deploy (requires Cloudflare credentials):
#   npm run deploy
name = "viral-templates"
compatibility_date = "2026-10-01"
# @waffo/pancake-ts signs with Node's crypto. Pages Functions need this flag.
compatibility_flags = ["nodejs_compat"]
# Checkout secrets are Pages secrets, not values in this file:
#   WAFFO_MERCHANT_ID  WAFFO_PRIVATE_KEY  WAFFO_PANCAKE_STORE_ID
#   WAFFO_PANCAKE_ENVIRONMENT=test (default) or prod
# See docs/credits-checkout.md.
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "viral-templates"
database_id = "f4c1f28f-f89a-4aba-91f6-ad4f23095a96"
preview_database_id = "f4c1f28f-f89a-4aba-91f6-ad4f23095a96"
migrations_dir = "migrations"

# Private media bucket. Create it before deploy (it is not created for you):
#   npx wrangler r2 bucket create viral-templates-media
# One bucket, key prefixes (do not enable the r2.dev public URL):
#   uploads/{userId}/{jobId}/{0|1}.{jpg|png|webp}   photos, default 7 days
#   results/{userId}/{jobId}.mp4                    finished clips, default 30 days
#   handoff/{userId}/{token}.jpg|png|webp           phone upload, delete after 1 day
#   templates/                                      reserved; the app does not write it
# Lifecycle rules are set on the bucket, not by this binding. See docs/r2-media.md.
# Remake worker (values are NOT stored in this file):
#   AGNES_API_KEY                Pages secret. Do not commit. Primary reference model.
#   AGNES_BASE_URL               optional text. Default https://api.agnes-ai.cn/v1
#   VIDEO_PROVIDER               optional text: agnes (default) or bailian
#   BAILIAN_API_KEY              Pages secret. Do not commit. Fallback mix model.
#   JOB_PROCESS_SECRET           Pages secret for POST /api/jobs/process
# Pages cannot run a cron. workers/job-drain is a separate Worker
# (*/2 * * * *) that POSTs that route. Do not add [triggers] here.
#   BAILIAN_DASHSCOPE_BASE_URL   optional text. Default is the workspace host in functions/_lib/bailian.js
#   BAILIAN_MODE                 optional text: wan-std (default) or wan-pro
#   BAILIAN_PUBLIC_MEDIA_BASE    leave unset. *.pages.dev is rejected (Aliyun cannot fetch it).
# See docs/bailian-animate.md.
# Local `wrangler pages dev` simulates MEDIA on disk. It does not use the remote bucket.
# Optional preview isolation (create that bucket first; otherwise leave this unset):
#   preview_bucket_name = "viral-templates-media-preview"
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "viral-templates-media"
